<div ngTabs class="flex flex-col gap-6">
  <!--
    selectionMode="explicit" : les flèches déplacent le focus, Entrée / Espace sélectionne.
    (en mode "follow", chaque flèche changerait d'étape — pas souhaitable pour un stepper)
  -->
  <div
    ngTabList
    selectionMode="explicit"
    [selectedTab]="selectedValue()"
    (selectedTabChange)="onSelectedValueChange($event)"
    class="flex items-center gap-3"
  >
    @for (step of steps(); track step; let i = $index, last = $last) { @let
    state = states()[i];

    <div
      ngTab
      [value]="`${i}`"
      class="flex cursor-pointer items-center gap-2 rounded-md p-1 outline-ring focus-visible:outline-2 focus-visible:outline-offset-2"
    >
      <span [class]="indicatorClass(state)">
        @if (state === 'complete') {
        <svg
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          class="size-4"
          aria-hidden="true"
        >
          <path
            d="M3.5 8.5l3 3 6-7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        } @else { {{ i + 1 }} }
      </span>
      <span [class]="labelClass(state)">{{ step.label() }}</span>
    </div>

    @if (!last) {
    <span
      aria-hidden="true"
      [class]="connectorClass(state === 'complete')"
    ></span>
    } }
  </div>

  @for (step of steps(); track step; let i = $index) {
  <!-- Aria rend le panneau masqué `inert`, mais le masquage visuel est à notre charge. -->
  <div
    ngTabPanel
    #panel="ngTabPanel"
    [value]="`${i}`"
    [hidden]="!panel.visible()"
  >
    <ng-template ngTabContent>
      <ng-container [ngTemplateOutlet]="step.content()" />
    </ng-template>
  </div>
  }
</div>
