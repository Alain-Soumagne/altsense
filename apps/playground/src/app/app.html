<header class="flex items-center justify-between gap-6 border-b px-6 py-4">
  <h1 class="text-xl font-semibold tracking-tight">
    Alt Sense <span class="font-normal text-muted-foreground">playground</span>
  </h1>

  <nav aria-label="Pages" class="flex flex-1 gap-1 text-sm">
    @for (page of pages; track page.path) {
      <a
        [routerLink]="page.path"
        routerLinkActive="bg-muted font-medium text-foreground"
        ariaCurrentWhenActive="page"
        class="rounded-md px-3 py-1.5 text-muted-foreground outline-ring hover:bg-muted focus-visible:outline-2"
      >
        {{ page.label }}
      </a>
    }
  </nav>

  <button
    type="button"
    class="rounded-md border px-3 py-1.5 text-sm outline-ring hover:bg-muted focus-visible:outline-2 focus-visible:outline-offset-2"
    [attr.aria-pressed]="dark()"
    (click)="toggleTheme()"
  >
    Thème sombre
  </button>
</header>

<main class="mx-auto max-w-3xl px-6 py-10">
  <router-outlet />
</main>
