<div class="space-y-6">
  <h2 class="text-lg font-semibold">Stepper piloté par le router</h2>
  <p class="text-sm text-muted-foreground">
    Chaque étape est une route (<code>/checkout/…</code>) : l'URL détermine l'étape courante, les
    étapes sont de vrais liens, et le contenu vient du <code>&lt;router-outlet&gt;</code>.
  </p>

  <as-stepper
    #stepper
    linear
    aria-label="Étapes de la commande"
    class="rounded-lg border bg-surface p-6"
  >
    <as-step label="Informations" link="informations" [completed]="store.nameValid()" />
    <as-step label="Livraison" link="livraison" [completed]="store.addressValid()" />
    <as-step label="Paiement" link="paiement" />

    <router-outlet />
  </as-stepper>

  <div class="flex items-center justify-between">
    <button
      type="button"
      class="rounded-md border px-4 py-2 text-sm outline-ring hover:bg-muted focus-visible:outline-2 focus-visible:outline-offset-2 disabled:opacity-50"
      [disabled]="!stepper.hasPrevious()"
      (click)="stepper.previous()"
    >
      Précédent
    </button>
    <button
      type="button"
      class="rounded-md bg-primary px-4 py-2 text-sm text-primary-foreground outline-ring focus-visible:outline-2 focus-visible:outline-offset-2 disabled:opacity-50"
      [disabled]="!stepper.hasNext()"
      (click)="stepper.next()"
    >
      Suivant
    </button>
  </div>
</div>
